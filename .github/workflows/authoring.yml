name: Authoring workbench

on:
  pull_request:
  push:
    branches:
      - feature/authoring-workbench-core

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall src/grace_atlas/authoring
      - name: Authoring tests
        run: pytest tests/test_authoring.py -q
      - name: Full regression
        run: pytest -q
      - name: CLI smoke
        run: |
          grace-atlas --version
          grace-atlas-author --help
